name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # The runner has no display. HighwayEnv imports pygame even when nothing
      # is rendered, so point SDL at a dummy driver.
      SDL_VIDEODRIVER: dummy
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests -q

      - name: Run the smoke test
        run: python testEnv.py
